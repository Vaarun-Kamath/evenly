# Self-hosting and local trial: `docker compose up` serves Evenly at http://localhost:3000.
# Settings can go in a `.env` file next to this one (see .env.example).
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: lib001
      POSTGRES_DB: lib001
      # Only reachable from the app container (the port is not published). Keep it URL-safe.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lib001}
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lib001 -d lib001"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # The published image when there is one (EVENLY_VERSION=0.1.0 pins a release); otherwise it is built from this
    # checkout, which is also what CI and `docker compose up --build` do.
    image: ghcr.io/vaarun-kamath/evenly:${EVENLY_VERSION:-latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lib001:${POSTGRES_PASSWORD:-lib001}@db:5432/lib001
      # If you change the published port or put the app behind a domain, set PUBLIC_URL to match.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Optional. When empty the app generates a secret on first start and keeps it in the database.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS:-true}
      INVITE_DEFAULT_TTL_DAYS: ${INVITE_DEFAULT_TTL_DAYS:-7}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # Optional email (password reset by email). SMTP_FROM is required when SMTP_URL is set.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
