name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      # A real Postgres for the integration tests (each test file gets its own database).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lib001
          POSTGRES_PASSWORD: lib001
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lib001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lib001:lib001@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the image and checks it at the site root and under /evenly.
      - run: bash scripts/smoke.sh

  e2e:
    name: End-to-end scenarios (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @evenly/e2e exec playwright install --with-deps chromium
      # SPEC.md section 7 against the built image, at the site root and under /evenly.
      - run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
